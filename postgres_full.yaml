apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '1'
  labels:
    app: postgres-replica
    app.kubernetes.io/instance: onap-postgres
    app.kubernetes.io/name: postgres-replica
    chart: postgres-13.1.0
    heritage: Helm
    name: pgset-replica
    release: onap
    version: 13.1.0
  name: onap-postgres-replica
  namespace: onap
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: postgres-replica
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: postgres-replica
        app.kubernetes.io/name: postgres-replica
        name: pgset-replica
        release: onap
        version: 13.1.0
    spec:
      containers:
      - env:
        - name: PGHOST
          value: /tmp
        - name: PG_PRIMARY_USER
          value: primaryuser
        - name: MODE
          value: postgres
        - name: PG_MODE
          value: replica
        - name: PG_PRIMARY_HOST
          value: tcp-pgset-primary
        - name: PG_REPLICA_HOST
          value: tcp-pgset-replica
        - name: PG_PRIMARY_PORT
          value: '5432'
        - name: PG_PRIMARY_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: onap-postgres-primary-password
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              key: login
              name: onap-postgres-db-user-credentials
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: onap-postgres-db-user-credentials
        - name: PG_DATABASE
          value: userdb
        - name: PG_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: onap-postgres-db-root-password
        - name: PGDATA_PATH_OVERRIDE
          value: data
        image: nexus3.onap.org:10001/crunchydata/crunchy-postgres:centos8-13.2-4.6.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 300
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 5432
          timeoutSeconds: 5
        name: postgres
        ports:
        - containerPort: 5432
          name: tcp-postgres
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 5432
          timeoutSeconds: 1
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /pgconf/pool_hba.conf
          name: config
          subPath: pool_hba.conf
        - mountPath: /pgconf/setup.sql
          name: pgconf
          subPath: setup.sql
        - mountPath: /pgdata
          name: onap-postgres-data
        - mountPath: /backup
          name: onap-postgres-backup
          readOnly: true
      dnsPolicy: ClusterFirst
      initContainers:
      - args:
        - -c
        - "function prepare_password {\n  echo -n $1 | sed -e \"s/'/''/g\"\n}\nexport\
          \ PG_PRIMARY_PASSWORD=`prepare_password $PG_PRIMARY_PASSWORD_INPUT`;\nexport\
          \ PG_PASSWORD=`prepare_password $PG_PASSWORD_INPUT`;\nexport PG_ROOT_PASSWORD=`prepare_password\
          \ $PG_ROOT_PASSWORD_INPUT`;\ncd /config-input && for PFILE in `ls -1 .`;\
          \ do envsubst <${PFILE} >/config/${PFILE}; done\n"
        command:
        - sh
        env:
        - name: PG_PRIMARY_USER
          value: primaryuser
        - name: MODE
          value: postgres
        - name: PG_PRIMARY_PASSWORD_INPUT
          valueFrom:
            secretKeyRef:
              key: password
              name: onap-postgres-primary-password
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              key: login
              name: onap-postgres-db-user-credentials
        - name: PG_PASSWORD_INPUT
          valueFrom:
            secretKeyRef:
              key: password
              name: onap-postgres-db-user-credentials
        - name: PG_DATABASE
          value: userdb
        - name: PG_ROOT_PASSWORD_INPUT
          valueFrom:
            secretKeyRef:
              key: password
              name: onap-postgres-db-root-password
        image: nexus3.onap.org:10001/dibi/envsubst:latest
        imagePullPolicy: IfNotPresent
        name: postgres-update-config
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config-input/setup.sql
          name: config
          subPath: setup.sql
        - mountPath: /config
          name: pgconf
      - command:
        - /bin/sh
        - -c
        - 'chown 26:26 /podroot/;

          chmod 700 /podroot/;

          '
        image: nexus3.onap.org:10001/busybox:1.37.0
        imagePullPolicy: IfNotPresent
        name: init-sysctl
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /podroot/
          name: onap-postgres-data
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: onap-postgres-backup
      - name: onap-postgres-data
        persistentVolumeClaim:
          claimName: onap-postgres-replica
      - configMap:
          defaultMode: 420
          name: onap-postgres
        name: config
      - emptyDir:
          medium: Memory
        name: pgconf
