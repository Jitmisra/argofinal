      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: mariadb-galera
      serviceAccountName: mariadb-galera
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: k8s.mariadb.com/ha
        operator: Exists
      volumes:
      - name: config
        projected:
          defaultMode: 420
          sources:
          - configMap:
              items:
              - key: 0-default.cnf
                path: 0-default.cnf
              name: mariadb-galera-config-default
          - configMap:
              items:
              - key: my.cnf
                path: my.cnf
              name: onap-mariadb-galera-configuration
          - configMap:
              items:
              - key: 1-tls.cnf
                path: 1-tls.cnf
              name: mariadb-galera-config-tls
      - name: pki
        projected:
          defaultMode: 420
          sources:
          - secret:
              items:
              - key: ca.crt
                path: ca.crt
              name: mariadb-galera-ca-bundle
          - secret:
              items:
              - key: tls.crt
                path: client.crt
              - key: tls.key
                path: client.key
              name: mariadb-galera-client-cert
          - secret:
              items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
              name: mariadb-galera-server-cert
      - emptyDir:
          sizeLimit: 64Mi
        name: run
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
